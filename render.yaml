# Render Blueprint (корень репо): Dashboard → Blueprints → New Blueprint Instance
# После деплоя: задайте PUBLIC_APP_URL = URL фронта (Vercel), обновите CORS_ORIGINS тем же URL (+ localhost при отладке).
# Секреты: DATABASE_URL, GEMINI_API_KEY (желательно), при необходимости GROQ_API_KEY, TELEGRAM_BOT_TOKEN.
services:
  - type: web
    name: jumysaq-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: PUBLIC_APP_URL
        value: "https://jumysaq.vercel.app"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: TELEGRAM_BOT_TOKEN
        sync: false

  - type: worker
    name: jumysaq-bot
    runtime: python
    plan: free
    region: oregon
    rootDir: bot
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: API_URL
        value: "https://jumysaq-api.onrender.com"
      - key: APP_URL
        value: "https://jumysaq.vercel.app"
